<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · DEWGRAVE</title>
<style>
:root{--paper:#f2ecdd;--paper2:#eae2cd;--ink:#171310;--ink-soft:#4a4136;--rule:#c9bfa6;--teal:#0c5a57;--red:#8c2a1e;--mono:ui-monospace,'Courier New',monospace;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:2px solid var(--ink);background:var(--paper2)}
.bar b{font-family:var(--mono);letter-spacing:.24em;font-size:16px}
.wrap{max-width:980px;margin:0 auto;padding:24px 20px 80px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
input,textarea,select{width:100%;font-family:var(--mono);font-size:13px;padding:10px 11px;border:2px solid var(--ink);background:var(--paper);margin-top:4px}
textarea{font-family:var(--serif);font-size:15px;min-height:120px;line-height:1.5}
label{display:block;margin:12px 0 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
button{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:11px 18px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}button.teal{background:var(--teal);border-color:var(--teal)}button.danger{background:var(--red);border-color:var(--red)}
button:hover{opacity:.9}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:20px 0 24px}
.tabs a{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;border:2px solid var(--ink);text-decoration:none;color:var(--ink);cursor:pointer}
.tabs a.on{background:var(--ink);color:var(--paper)}
.item{border:2px solid var(--ink);background:var(--paper);padding:16px 18px;margin-bottom:14px}
.item h4{margin:0 0 4px;font-size:20px}
.item .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.msg{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.msg.ok{color:var(--teal)}.msg.err{color:var(--red)}
.card{border:2px solid var(--ink);max-width:380px;margin:60px auto;padding:30px}
.note{font-size:13px;color:var(--ink-soft);font-family:var(--mono);line-height:1.6;border:2px dashed var(--rule);padding:14px;margin-bottom:18px}
details summary{cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 0}
.pill{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1.5px solid var(--ink);margin-left:8px}
.pill.off{color:var(--red);border-color:var(--red)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="bar"><b>DEWGRAVE · ADMIN</b><span><button class="ghost" id="logout" style="display:none">Log out</button></span></div>
<div class="wrap" id="root"><p class="mono">Loading…</p></div>
<script>
const $=s=>document.querySelector(s);
const E=(s)=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let DATA=null, TAB="art";
async function api(action, payload){
  const r=await fetch("/api/admin/"+action,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload||{})});
  return r.json();
}
async function boot(){
  const me=await fetch("/api/admin/me",{method:"POST"}).then(r=>r.json()).catch(()=>({}));
  window._me=me;
  if(!me.ok){ return renderLogin(me.configured===false); }
  $("#logout").style.display="inline-block";
  await loadAll(); renderTabs();
}
function renderLogin(notConfigured){
  $("#root").innerHTML=`<div class="card"><div class="mono">The Backbone</div><h2 style="margin:6px 0 16px">Sign in</h2>
   ${notConfigured?`<div class="note">Admin isn't switched on yet. Set <b>ADMIN_SECRET</b>, <b>RESEND_API_KEY</b> and <b>RESEND_FROM</b>, and bind the D1 database, on the Pages project, then reload.</div>`:''}
   <div id="step1"><label>Your email</label><input type="email" id="em" autofocus placeholder="you@example.com" autocomplete="email">
     <div style="margin-top:16px"><button type="button" id="sendBtn">Email me a code</button><span class="msg" id="lm"></span></div></div>
   <div id="step2" style="display:none"><div class="note">We sent a 6-digit code to <b id="emShow"></b>. It's just a number, there's no link to click. Enter it below.</div>
     <label>6-digit code</label><input type="text" id="cd" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
     <div style="margin-top:16px"><button type="button" id="verifyBtn">Sign in</button><a id="startOver" style="cursor:pointer;font-family:var(--mono);font-size:12px;margin-left:12px">start over</a><span class="msg" id="vm"></span></div></div>
   </div>`;
  const send=async()=>{const m=$("#lm");const email=$("#em").value.trim();if(!email){m.textContent="Enter your email";m.className="msg err";return;}m.textContent="Sending…";m.className="msg";
    const r=await api("request-code",{email});
    if(r.ok){window._loginEmail=email;$("#step1").style.display="none";$("#emShow").textContent=email;$("#step2").style.display="block";$("#cd").focus();}
    else{m.textContent=r.error||"Failed";m.className="msg err";}};
  const verify=async()=>{const m=$("#vm");m.textContent="Checking…";m.className="msg";
    const r=await api("verify-code",{email:window._loginEmail,code:$("#cd").value.trim()});
    if(r.ok){location.reload();}else{m.textContent=r.error||"Failed";m.className="msg err";}};
  $("#sendBtn").onclick=send;
  $("#em").onkeydown=e=>{if(e.key==="Enter")send();};
  $("#verifyBtn").onclick=verify;
  $("#cd").onkeydown=e=>{if(e.key==="Enter")verify();};
  $("#startOver").onclick=()=>location.reload();
}
$("#logout").onclick=()=>{ location.href="/cdn-cgi/access/logout"; };
async function loadAll(){ const r=await api("list"); if(r.ok){DATA=r.content;} }
function setTab(t){TAB=t;renderTabs();}
function renderTabs(){
  const tabs=["art","writings","events","blog","sitetext","settings","subscribers","visitors"];
  const names={art:"Art",writings:"Writings",events:"Events",blog:"Blog",sitetext:"Site Text",settings:"Pages & Prints",subscribers:"Subscribers",visitors:"Visitors"};
  let html=`<div class="tabs">${tabs.map(t=>`<a class="${t===TAB?'on':''}" onclick="setTab('${t}')">${names[t]}</a>`).join("")}</div><div id="panel"></div>`;
  $("#root").innerHTML=html;
  ({art:renderArt,writings:renderWritings,events:renderEvents,blog:renderBlog,sitetext:renderSiteText,settings:renderSettings,subscribers:renderSubs,visitors:renderVisitors}[TAB])();
}
window.setTab=setTab;

function field(label,id,val,ta){return `<label>${label}</label>${ta?`<textarea id="${id}">${E(val)}</textarea>`:`<input id="${id}" value="${E(val)}">`}`;}
function chk(label,id,on){return `<label style="display:flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" id="${id}" ${on?'checked':''} style="width:auto;margin:0"> ${label}</label>`;}
function saveMsg(el,r){el.textContent=r.ok?"Saved":(r.error||"Error");el.className="msg "+(r.ok?"ok":"err");if(r.ok)setTimeout(()=>el.textContent="",1500);}

/* ART */
function renderArt(){
  const items=DATA.art||[];
  $("#panel").innerHTML=`<button class="teal" onclick="editArt()">+ Add artwork</button>
   <p class="note">Editing summaries, categories, sort order, and print settings is live instantly. To put a piece on sale, tick “For sale” and paste your print-on-demand product link.</p>
   ${items.map(a=>`<div class="item"><h4>${E(a.title)} ${a.published?'':'<span class="pill off">hidden</span>'} ${a.for_sale?'<span class="pill">for sale</span>':''}</h4>
     <div class="mono">${E(a.category)} · ${E(a.slug)}</div>
     <div class="row"><button class="ghost" onclick="editArt('${E(a.slug)}')">Edit</button></div></div>`).join("")}`;
}
window.editArt=(slug)=>{
  const a = (typeof slug==='string' && slug) ? ((DATA.art||[]).find(x=>x.slug===slug)||{}) : {};
  const isNew=!a.slug;
  $("#panel").innerHTML=`<h3>${isNew?'New artwork':'Edit: '+E(a.title)}</h3>
   ${isNew?`<div class="note">For a new piece, choose an image file, it's resized in your browser and stored in the database, then served at /art/full/&lt;slug&gt;.webp automatically.</div>`:''}
   <div class="grid2">${field("Title","f_title",a.title)}${field("Slug (url, lowercase-hyphen)","f_slug",a.slug)}</div>
   <div class="grid2">${field("Category","f_cat",a.category)}${field("Palette","f_pal",a.palette)}</div>
   ${field("Summary","f_sum",a.summary,true)}
   <div class="grid2">${field("Sort","f_sort",a.sort||0)}<div>${chk("NSFW (behind gate)","f_nsfw",a.nsfw)}${chk("Published","f_pub",a.published!==0)}</div></div>
   <details style="margin-top:14px"><summary>Print sale settings</summary>
     ${chk("For sale","f_sale",a.for_sale)}
     <div class="grid2">${field("Print product URL","f_purl",a.print_url)}${field("Price label (e.g. £45)","f_price",a.print_price)}</div>
     ${field("Print note (optional)","f_pnote",a.print_note)}</details>
   ${isNew?`<label>Image file</label><input type="file" id="f_img" accept="image/*">`:''}
   <div style="margin-top:18px"><button onclick="doSaveArt(${isNew})">Save</button> <button class="ghost" onclick="renderTabs()">Cancel</button>
   ${!isNew?`<button class="danger" onclick="delItem('art','${a.slug}')" style="float:right">Delete</button>`:''}<span class="msg" id="sm"></span></div>`;
};
async function fileToWebp(file,max){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});
  let {width:w,height:h}=img; const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc);h=Math.round(h*sc);
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
  return {data:c.toDataURL("image/webp",0.72), w:img.naturalWidth, h:img.naturalHeight};
}
window.doSaveArt=async(isNew)=>{
  const m=$("#sm");m.textContent="…";m.className="msg";
  const rec={slug:$("#f_slug").value.trim(),title:$("#f_title").value.trim(),category:$("#f_cat").value.trim(),palette:$("#f_pal").value.trim(),
    summary:$("#f_sum").value.trim(),sort:parseInt($("#f_sort").value)||0,nsfw:$("#f_nsfw").checked?1:0,published:$("#f_pub").checked?1:0,
    for_sale:$("#f_sale").checked?1:0,print_url:$("#f_purl").value.trim(),print_price:$("#f_price").value.trim(),print_note:$("#f_pnote").value.trim()};
  if(!rec.slug||!rec.title){m.textContent="Title & slug required";m.className="msg err";return;}
  if(isNew){const f=$("#f_img").files[0]; if(f){ try{const full=await fileToWebp(f,1100);const th=await fileToWebp(f,340);rec.img_blob=full.data;rec.thumb_blob=th.data;rec.w=full.w;rec.h=full.h;}catch(e){m.textContent="Image error";m.className="msg err";return;} } }
  const r=await api("save",{type:"art",record:rec}); saveMsg(m,r); if(r.ok){await loadAll();setTimeout(()=>{TAB="art";renderTabs();},700);}
};

/* WRITINGS */
function renderWritings(){
  $("#panel").innerHTML=`<button class="teal" onclick="editWriting()">+ Add writing</button>
   ${(DATA.writings||[]).map(w=>`<div class="item"><h4>${E(w.title)} ${w.published?'':'<span class="pill off">hidden</span>'} ${w.cw?'<span class="pill">CW</span>':''}</h4><div class="mono">${E(w.kind)} · ${E(w.slug)}</div><div class="row"><button class="ghost" onclick="editWriting('${E(w.slug)}')">Edit</button></div></div>`).join("")}`;
}
window.editWriting=(slug)=>{const w=(typeof slug==='string'&&slug)?((DATA.writings||[]).find(x=>x.slug===slug)||{}):{};const isNew=!w.slug;
  $("#panel").innerHTML=`<h3>${isNew?'New writing':'Edit: '+E(w.title)}</h3>
   <div class="grid2">${field("Title","w_title",w.title)}${field("Slug","w_slug",w.slug)}</div>
   <div class="grid2">${field("Kind (Fables/Essays/…)","w_kind",w.kind)}${field("PDF path (/writings/x.pdf)","w_pdf",w.pdf)}</div>
   <label>Upload / replace PDF (its text auto-fills Full text; served at /writings/&lt;slug&gt;.pdf)</label><input type="file" id="w_pdf_file" accept="application/pdf">
   ${field("Blurb (card text)","w_blurb",w.blurb,true)}${field("Summary (short, shown above the full text)","w_sum",w.summary,true)}
   ${field("Full text (the whole writing, shown on its page; leave blank to show only the summary and PDF link)","w_body",w.body||"",true)}
   <div class="grid2">${field("Sort","w_sort",w.sort||0)}<div>${chk("Content warning","w_cw",w.cw)}${chk("Published","w_pub",w.published!==0)}</div></div>
   <div class="note">Paste the whole writing into <b>Full text</b> above to show it on the page. The PDF link is optional (it stays as a Download button).</div>
   <div style="margin-top:18px"><button onclick="doSaveWriting()">Save</button> <button class="ghost" onclick="renderTabs()">Cancel</button>${!isNew?`<button class="danger" onclick="delItem('writings','${w.slug}')" style="float:right">Delete</button>`:''}<span class="msg" id="sm"></span></div>`;
};
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
async function pdfToText(f){const buf=await f.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let out="";for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();out+=tc.items.map(i=>i.str).join(" ")+"\n\n";}return out.trim();}
window.doSaveWriting=async()=>{const m=$("#sm");const rec={slug:$("#w_slug").value.trim(),title:$("#w_title").value.trim(),kind:$("#w_kind").value.trim(),pdf:$("#w_pdf").value.trim(),blurb:$("#w_blurb").value.trim(),summary:$("#w_sum").value.trim(),body:$("#w_body").value,sort:parseInt($("#w_sort").value)||0,cw:$("#w_cw").checked?1:0,published:$("#w_pub").checked?1:0};
  if(!rec.slug||!rec.title){m.textContent="Title & slug required";m.className="msg err";return;}
  const pf=$("#w_pdf_file")?$("#w_pdf_file").files[0]:null;
  if(pf){m.textContent="Reading PDF...";m.className="msg";try{rec.pdf_blob=await fileToDataURL(pf);}catch(e){m.textContent="PDF read error";m.className="msg err";return;}
  try{if(!pdfjsLib.GlobalWorkerOptions.workerSrc){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}const txt=await pdfToText(pf);if(txt){rec.body=txt;}}catch(e){}
  if(!rec.pdf){rec.pdf="/writings/"+rec.slug+".pdf";}}
  const r=await api("save",{type:"writings",record:rec});saveMsg(m,r);if(r.ok){await loadAll();setTimeout(()=>{TAB="writings";renderTabs();},700);}};

/* EVENTS */
function renderEvents(){
  $("#panel").innerHTML=`<button class="teal" onclick="editEvent()">+ Add event</button>
   ${(DATA.events||[]).length? (DATA.events||[]).map(e=>`<div class="item"><h4>${E(e.title)} ${e.published?'':'<span class="pill off">hidden</span>'}</h4><div class="mono">${E(e.date)} · ${E(e.location)}</div><div class="row"><button class="ghost" onclick="editEvent(${e.id})">Edit</button></div></div>`).join("") : '<p class="note">No events yet. Add one and it appears on the Events page instantly.</p>'}`;
}
window.editEvent=(id)=>{const e=id?((DATA.events||[]).find(x=>x.id===id)||{}):{};const isNew=!e.id;
  $("#panel").innerHTML=`<h3>${isNew?'New event':'Edit event'}</h3>
   ${field("Title","e_title",e.title)}
   <div class="grid2">${field("Date (e.g. 14 Aug 2026, 7pm)","e_date",e.date)}${field("Location","e_loc",e.location)}</div>
   ${field("Description","e_desc",e.description,true)}${field("Link (optional)","e_link",e.link)}
   <div class="grid2">${field("Sort","e_sort",e.sort||0)}<div>${chk("Published","e_pub",e.published!==0)}</div></div>
   <div style="margin-top:18px"><button onclick="doSaveEvent(${e.id||0})">Save</button> <button class="ghost" onclick="renderTabs()">Cancel</button>${!isNew?`<button class="danger" onclick="delItem('events',${e.id})" style="float:right">Delete</button>`:''}<span class="msg" id="sm"></span></div>`;
};
window.doSaveEvent=async(id)=>{const m=$("#sm");const rec={id:id||undefined,title:$("#e_title").value.trim(),date:$("#e_date").value.trim(),location:$("#e_loc").value.trim(),description:$("#e_desc").value.trim(),link:$("#e_link").value.trim(),sort:parseInt($("#e_sort").value)||0,published:$("#e_pub").checked?1:0};
  if(!rec.title){m.textContent="Title required";m.className="msg err";return;}
  const r=await api("save",{type:"events",record:rec});saveMsg(m,r);if(r.ok){await loadAll();setTimeout(()=>{TAB="events";renderTabs();},700);}};

/* BLOG */
function renderBlog(){
  $("#panel").innerHTML=`<button class="teal" onclick="editPost()">+ New post</button>
   ${(DATA.posts||[]).map(p=>`<div class="item"><h4>${E(p.title)} ${p.published?'':'<span class="pill off">draft</span>'}</h4><div class="mono">${E(p.date)} · ${E(p.tag)} · ${E(p.slug)}</div><div class="row"><button class="ghost" onclick="editPost('${E(p.slug)}')">Edit</button></div></div>`).join("")}`;
}
window.editPost=(slug)=>{const p=(typeof slug==='string'&&slug)?((DATA.posts||[]).find(x=>x.slug===slug)||{}):{};const isNew=!p.slug;
  $("#panel").innerHTML=`<h3>${isNew?'New post':'Edit: '+E(p.title)}</h3>
   <div class="grid2">${field("Title","p_title",p.title)}${field("Slug","p_slug",p.slug)}</div>
   <div class="grid2">${field("Tag (e.g. Notes)","p_tag",p.tag)}${field("Date (YYYY-MM-DD)","p_date",p.date)}</div>
   ${field("Excerpt (list preview)","p_exc",p.excerpt,true)}
   ${field("Body (separate paragraphs with a blank line)","p_body",p.body,true)}
   <div>${chk("Published","p_pub",p.published!==0)}</div>
   <div style="margin-top:18px"><button onclick="doSavePost()">Save</button> <button class="ghost" onclick="renderTabs()">Cancel</button>${!isNew?`<button class="danger" onclick="delItem('posts','${p.slug}')" style="float:right">Delete</button>`:''}<span class="msg" id="sm"></span></div>`;
};
window.doSavePost=async()=>{const m=$("#sm");const rec={slug:$("#p_slug").value.trim(),title:$("#p_title").value.trim(),tag:$("#p_tag").value.trim(),date:$("#p_date").value.trim(),excerpt:$("#p_exc").value.trim(),body:$("#p_body").value,sort:0,published:$("#p_pub").checked?1:0};
  if(!rec.slug||!rec.title){m.textContent="Title & slug required";m.className="msg err";return;}
  const r=await api("save",{type:"posts",record:rec});saveMsg(m,r);if(r.ok){await loadAll();setTimeout(()=>{TAB="blog";renderTabs();},700);}};

/* SETTINGS */
function getSet(k){const s=(DATA.settings||[]).find(x=>x.key===k);return s?s.value:"";}
const DEF={"page_ken":"\n  <p>KEN is the backbone. To <em>ken</em> is to know, to perceive, to hold a thing in understanding. It is the oldest word in this archive and the one every other piece bends toward.</p>\n  <p>Dewgrave's project treats information as the fundamental material. Not paint, not paper, not language for its own sake, but the signal carried underneath all of them. The visual works repeat a binary refrain (0101010), a sign that the message is always there to be decoded if you have learned how to read.</p>\n  <h3>The Hermetic frame</h3><p>The work sits inside a Hermetic lineage. Two texts anchor it:</p>\n  <p><em>The Emerald Tablet.</em> \"As above, so below.\" The pattern that holds at the largest scale holds at the smallest. The piece <a href=\"/art/microcosmic\">Microcosmic</a> is the most direct statement of this principle, but the correspondence runs through everything: citadels mirror minds, growth-studies mirror cosmologies.</p>\n  <p><em>The Kybalion.</em> The seven Hermetic principles operate here as a grammar. The first, that \"all is mind,\" is why information can be treated as the ground of reality rather than a description of it.</p>\n  <h3>Signal and noise</h3><p>\"The medium is the message.\" Across the writings and the ink works, Dewgrave returns to the difference between noise (the surface, the framing, the panther at the door) and signal (the wisdom hidden plainly, always in the guise of a story). KEN is the act of telling them apart.</p>\n  <p class=\"notice\">As above, so below.</p>","page_research":"<div class=\"prose\">\n  <p>The long aim of this archive is to become a nonprofit foundation, and to invite data analysts, mathematicians, and physicists to treat the corpus as a serious experimental program: to run the tests, including on the question of time.</p>\n  <p>The works are dense by design. They repeat, fold back on themselves, and hide structure inside narrative. Dewgrave's wager is that there is measurable pattern in the corpus worth studying with proper tools, not only literary reading.</p></div>\n  <div class=\"grid2\" style=\"margin-top:34px\">\n   <div class=\"card\"><div class=\"mono\">01 · Archive</div><h3>Catalogue</h3><p>Every text and visual work in one place, with a clean record of each piece. <em>This step is done, you are looking at it.</em></p></div>\n   <div class=\"card\"><div class=\"mono\">02 · Foundation</div><h3>Nonprofit</h3><p>Stand up a foundation so the work can be held, funded, and stewarded outside of any single person.</p></div>\n   <div class=\"card\"><div class=\"mono\">03 · Tests</div><h3>Experiments</h3><p>Bring on data and analytics experts to run the experiments, including the work on time, and publish what they find.</p></div>\n   <div class=\"card\"><div class=\"mono\">∞ · Get involved</div><h3>Contact</h3><p>If you work in data, mathematics, or physics and this interests you, the foundation is being formed now. Join the mailing list to be kept in the loop.</p></div></div>","page_author":"\n   <p><em>Will Dewgrave</em> is the name signed, forwards, backwards, and folded into sigils, across everything in this archive: four books, fifty-three ink works, and one recurring insistence that <em>there is nothing going on</em>.</p>\n   <p>The author works in black ink on white paper, in invented scripts and borrowed rituals, in fables that know they are fables. The books are free to reproduce (\"share this document as you Will\"), and the works claim no rights - the archive's economy runs on KEN, not copyright.</p>\n   <p>The signature is the seal: WILL DEWGRAVE, mirrored as EVARGWED LLIW, appears inside the works themselves, a name treated as a sigil, an identity treated as a vine that grows around and through its structures.</p>\n   <p class=\"notice\">Dedicated to the characters in stories, may they find happy endings after we stop reading.</p>","intro_gallery":"Fifty-three works, six rooms. Mostly black ink on white paper - citadels, portals, letterforms, rituals, growth - with the occasional teal flare. Each piece hangs with its own summary.","intro_writings":"Four books under the imprint C.&amp;C. DEWGRAVE &amp; Co. No. I. Free to reproduce; share these documents as you Will. Each is summarised below and hosted in full.","intro_blog":"New ideas, new art, new stories, and notes from the studio as the work moves. The freshest part of the archive.","intro_events":"Readings, showings, and gatherings under the Dewgrave imprint."};
const SITETEXT=[["page_ken","KEN page","html"],["page_research","Research page","html"],["page_author","Author page (the writing, not the sigil)","html"],["intro_gallery","Gallery intro line","text"],["intro_writings","Writings intro line","text"],["intro_blog","Blog intro line","text"],["intro_events","Events intro line","text"]];
function renderSiteText(){$("#panel").innerHTML=`<h3>Site text</h3>
   <p class="note">Edit the words on the KEN, Research and Author pages and the section intros. The three page boxes accept HTML (so links and headings keep working); the intro lines are plain text. Clear a box and save to restore the built-in default.</p>
   ${SITETEXT.map(([k,label,kind])=>field(label+(kind==="html"?" (HTML)":""),"st_"+k,getSet(k)||DEF[k]||"",true)).join("")}
   <div style="margin-top:18px"><button onclick="doSaveSiteText()">Save site text</button><span class="msg" id="sm"></span></div>`;}
window.doSaveSiteText=async()=>{const m=$("#sm");m.textContent="…";for(const [k] of SITETEXT){const v=$("#st_"+k).value;await api("save",{type:"settings",record:{key:k,value:v}});}m.textContent="Saved";m.className="msg ok";await loadAll();setTimeout(()=>m.textContent="",1500);};
function renderSettings(){
  $("#panel").innerHTML=`<h3>Pages &amp; print settings</h3>
   <p class="note">These edit the homepage intro, the print room, and your contact email. Saved live.</p>
   ${field("Homepage lede (leave blank for the default)","s_home",getSet("home_lede"),true)}
   ${field("Prints intro (Prints page)","s_pintro",getSet("prints_intro"),true)}
   ${field("Contact email (for print enquiries)","s_contact",getSet("contact_email"))}
   <label style="display:flex;gap:8px;align-items:center;text-transform:none;margin-top:12px"><input type="checkbox" id="s_pen" ${getSet("prints_enabled")==="1"?"checked":""} style="width:auto;margin:0"> Show print buttons / prints page</label>
   <div style="margin-top:18px"><button onclick="doSaveSettings()">Save settings</button><span class="msg" id="sm"></span></div>`;
}
window.doSaveSettings=async()=>{const m=$("#sm");m.textContent="…";
  const items=[["home_lede",$("#s_home").value],["prints_intro",$("#s_pintro").value],["contact_email",$("#s_contact").value.trim()],["prints_enabled",$("#s_pen").checked?"1":"0"]];
  for(const [k,v] of items){ await api("save",{type:"settings",record:{key:k,value:v}}); }

/* SUBSCRIBERS */
async function renderSubs(){
  const r=await api("subscribers");const subs=(r.subscribers||[]);
  $("#panel").innerHTML=`<h3>Mailing list (${subs.length})</h3>
   <div style="margin:10px 0"><button class="ghost" onclick="exportSubs()">Export CSV</button></div>
   <div class="note">Captured in your database. If you connect Resend (RESEND_API_KEY + RESEND_AUDIENCE_ID), they're also pushed there with a welcome email.</div>
   ${subs.map(s=>`<div class="item" style="padding:10px 14px"><b style="font-family:var(--mono);font-size:13px">${E(s.email)}</b><span class="mono" style="margin-left:10px">${E(s.source)} · ${E((s.ts||'').slice(0,10))}</span></div>`).join("")||'<p class="note">No sign-ups yet.</p>'}`;
  window._subs=subs;
}
window.exportSubs=()=>{const rows=[["email","source","date"]].concat((window._subs||[]).map(s=>[s.email,s.source,s.ts]));
  const csv=rows.map(r=>r.map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="dewgrave-subscribers.csv";a.click();};

/* VISITORS */
async function renderVisitors(){
  $("#panel").innerHTML='<p class="mono">Loading analytics…</p>';
  const [r, cf] = await Promise.all([api("analytics"), api("cf-history")]);
  const kpi=(n,l)=>`<div style="border:2px solid var(--ink);padding:14px 16px;min-width:110px;flex:1"><div style="font-size:30px;font-family:var(--mono);font-weight:bold">${Number(n||0).toLocaleString()}</div><div class="mono" style="color:var(--ink-soft)">${l}</div></div>`;
  const list=(arr,key,label)=>`<div class="item"><div class="mono" style="margin-bottom:8px">${label}</div>${arr.length?arr.map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);padding:5px 0;font-size:13px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(String(x[key]||'-'))}</span><b style="font-family:var(--mono)">${x.c}</b></div>`).join(""):'<div class="mono" style="color:var(--ink-soft)">No data yet</div>'}</div>`;
  const barRow=(arr,vk,color)=>{const mx=Math.max(1,...arr.map(d=>d[vk]||0));return `<div style="display:flex;gap:3px;align-items:flex-end;height:120px">${arr.map(d=>`<div title="${E(d.d)}: ${Number(d[vk]||0).toLocaleString()}" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center"><div style="width:64%;background:${color};height:${Math.round((d[vk]||0)/mx*110)}px;min-height:2px"></div></div>`).join("")||'<span class="mono" style="color:var(--ink-soft)">No data</span>'}</div>`;};
  let cfHtml='';
  if(cf && cf.configured && !cf.error){
    const ct=cf.totals||{};
    cfHtml=`<h3 style="margin:0 0 6px">Site-wide history · Cloudflare</h3>
     <div class="note">All traffic to dewgrave.com over the last ${cf.days||30} days, straight from Cloudflare, including the period before this admin's own tracker began.</div>
     <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">${kpi(ct.pageViews,"Page views · 30d")}${kpi(ct.uniques,"Unique visitors · 30d")}${kpi(ct.requests,"Requests · 30d")}</div>
     <div class="item"><div class="mono" style="margin-bottom:14px">Page views per day · last 30 days</div>${barRow(cf.byday||[],'pv','var(--ink)')}</div>
     <hr style="border:none;border-top:2px solid var(--rule);margin:28px 0 22px">`;
  } else if(cf && cf.configured===false){
    cfHtml=`<div class="note"><b>Show your historical site-wide traffic here:</b> add a Cloudflare API token. Pages project → Settings → Variables and secrets → add a <b>Secret</b> named <b>CF_ANALYTICS_TOKEN</b> (a read-only Analytics token, you can reuse the one your Caz dashboard uses), then reload. The live tracker below works regardless.</div>`;
  } else if(cf && cf.error){
    cfHtml=`<div class="note">Cloudflare history couldn't load: ${E(cf.error)}</div>`;
  }
  let fpHtml='';
  if(r && r.ok){
    const t=r.totals||{}, byday=r.byday||[], paths=r.paths||[], countries=r.countries||[], refs=r.refs||[], recent=r.recent||[];
    fpHtml=`<h3 style="margin:0 0 6px">Live tracker · this site</h3>
     <div class="note">First-party analytics recorded by your own site, no third-party trackers, no IPs stored. Counts begin when this was switched on; obvious bots are filtered out.</div>
     <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">${kpi(t.v1,"Views · 24h")}${kpi(t.v30,"Views · 30d")}${kpi(t.u30,"Unique · 30d")}${kpi(t.all_views,"Views · all time")}</div>
     <div class="item"><div class="mono" style="margin-bottom:14px">Views per day · last 30 days</div>${barRow(byday,'c','var(--teal)')}</div>
     <div class="grid2">${list(paths,'path','Top pages · 30d')}${list(countries,'country','Top countries · 30d')}</div>
     ${refs.length?list(refs,'ref','Top referrers · 30d'):''}
     <div class="item"><div class="mono" style="margin-bottom:8px">Recent visits</div>${recent.length?recent.map(v=>`<div style="display:grid;grid-template-columns:140px 1fr 50px;gap:8px;border-top:1px solid var(--rule);padding:5px 0;font-size:12px;font-family:var(--mono)"><span style="color:var(--ink-soft)">${E(new Date(v.ts).toLocaleString())}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(v.path)}</span><span>${E(v.country||'')}</span></div>`).join(""):'<div class="mono" style="color:var(--ink-soft)">No visits recorded yet</div>'}</div>`;
  } else {
    fpHtml=`<div class="note">Live tracker couldn't load: ${E((r&&r.error)||'')}</div>`;
  }
  $("#panel").innerHTML=cfHtml+fpHtml;
}

window.delItem=async(type,id)=>{if(!confirm("Delete this "+type.replace(/s$/,'')+"? This cannot be undone."))return;
  const r=await api("delete",{type,id});if(r.ok){await loadAll();renderTabs();}else alert(r.error||"Delete failed");};

boot();
</script>
<script>(function(){var RE=/^[a-z0-9-]+$/;function showErr(el,msg){var d=document.getElementById('w_slug_err');if(!d){d=document.createElement('div');d.id='w_slug_err';d.style.cssText='color:#c0392b;font-size:13px;margin:4px 0 0';if(el&&el.parentNode)el.parentNode.appendChild(d);}d.textContent=msg;}function clearErr(){var d=document.getElementById('w_slug_err');if(d)d.remove();}function cap(){var sl=document.getElementById('w_slug');if(sl&&!sl.__cap){window.__wOrig=(sl.value||'').trim();sl.__cap=1;}}function hidePdf(){var pdf=document.getElementById('w_pdf');if(!pdf||pdf.__h)return;var lab=pdf.previousElementSibling;if(!(lab&&/pdf path/i.test(lab.textContent||''))){lab=[...pdf.parentElement.querySelectorAll('label')].filter(function(l){return /pdf path/i.test(l.textContent||'');})[0];}if(lab)lab.style.display='none';pdf.style.display='none';pdf.__h=1;}function pstat(force){var fi=document.getElementById('w_pdf_file');if(!fi)return;var slug=(window.__wOrig||'').trim();var box=document.getElementById('w_pdf_status');if(!box){box=document.createElement('div');box.id='w_pdf_status';box.style.cssText='font-size:13px;margin:6px 0 10px';if(fi&&fi.parentNode)fi.parentNode.insertBefore(box,fi.nextSibling);}if(!force&&box.__slug===slug)return;box.__slug=slug;if(!RE.test(slug)){box.textContent='';return;}box.textContent='Checking for an attached PDF...';fetch('/writings/'+slug+'.pdf?x='+Date.now()).then(function(r){if(r.status!==200){box.textContent='No PDF uploaded yet.';return;}var up=((r.headers.get('content-disposition')||'').indexOf('inline')>=0)&&!r.headers.get('etag');box.textContent='';var s=document.createElement('span');s.textContent=up?'PDF uploaded. ':'Built-in PDF file in use. ';box.appendChild(s);var v=document.createElement('a');v.href='/writings/'+slug+'.pdf';v.target='_blank';v.textContent='View';v.style.marginRight='12px';box.appendChild(v);if(up){var rm=document.createElement('button');rm.type='button';rm.textContent='Remove PDF';rm.style.cssText='font-size:12px;padding:2px 8px;cursor:pointer';rm.onclick=function(){if(!confirm('Remove the uploaded PDF? The page will fall back to the built-in file if one exists.'))return;rm.disabled=true;rm.textContent='Removing...';fetch('/api/admin/clearpdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'writings',slug:slug})}).then(function(x){return x.json();}).then(function(j){if(j&&j.ok){setTimeout(function(){pstat(true);},800);}else{rm.disabled=false;rm.textContent='Remove PDF';alert('Could not remove: '+((j&&j.error)||'error'));}}).catch(function(e){rm.disabled=false;rm.textContent='Remove PDF';alert('Could not remove: '+e);});};box.appendChild(rm);}}).catch(function(){box.textContent='';});}function wrapSave(){if(typeof window.doSaveWriting!=='function'||window.doSaveWriting.__w)return;var orig=window.doSaveWriting;function patched(){var self=this,args=arguments;var el=document.getElementById('w_slug');var slug=el?(el.value||'').trim():'';if(el)el.value=slug;if(!RE.test(slug)){showErr(el,'Invalid slug: use only lowercase letters, numbers, and hyphens. No spaces or capital letters.');if(el)el.focus();return false;}clearErr();var pdf=document.getElementById('w_pdf');if(pdf)pdf.value='/writings/'+slug+'.pdf';var old=window.__wOrig;var after=function(r){window.__wOrig=slug;var s2=document.getElementById('w_slug');if(s2)s2.__cap=1;setTimeout(function(){pstat(true);},1300);return r;};if(old&&old!==slug){return fetch('/api/admin/renamewriting',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'writings',oldSlug:old,newSlug:slug})}).then(function(){return orig.apply(self,args);}).then(after);}return Promise.resolve(orig.apply(self,args)).then(after);}patched.__w=1;window.doSaveWriting=patched;}function tick(){wrapSave();if(document.getElementById('w_pdf')){cap();hidePdf();pstat(false);}}document.addEventListener('click',function(){setTimeout(tick,300);},true);setInterval(tick,900);tick();})();</script></body>
